name: Isolated upstream no-retry prototype
on:
  push:
    paths:
      - 'upstream_patches/**'
      - 'scripts/test_upstream_prototype.py'
      - 'tests/wire.py'
      - 'requirements-test.txt'
      - '.github/workflows/upstream-prototype.yml'
  pull_request:
    paths:
      - 'upstream_patches/**'
      - 'scripts/test_upstream_prototype.py'
      - 'tests/wire.py'
      - 'requirements-test.txt'
      - '.github/workflows/upstream-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/test_upstream_prototype.py

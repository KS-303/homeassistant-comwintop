name: Publish beta release

on:
  push:
    branches: [main]
    paths:
      - '.github/release/b30.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
          cache: pip
      - name: Verify b30 and run full checks
        run: |
          python -m pip install -r requirements-test.txt
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          version = json.loads(Path("custom_components/comwintop/manifest.json").read_text())["version"]
          assert version == "0.1.0b30"
          assert tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"] == version
          assert Path(".github/release/b30.txt").read_text().strip() == version
          PY
          ruff check .
          ruff format --check .
          pytest --cov=custom_components.comwintop --cov-report=term-missing --cov-fail-under=85
          python scripts/check_package.py
          python scripts/build_package.py
      - name: Publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -f /tmp/no-use
          gh release create v0.1.0b30 dist/comwintop-0.1.0b30-install.zip dist/comwintop-0.1.0b30-install.zip.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "ComWinTop 0.1.0b30 (Beta)" \
            --notes-file docs/release_notes_b30.md

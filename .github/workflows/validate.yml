name: Validate read-only beta
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=custom_components.comwintop --cov-report=term-missing --cov-fail-under=85 --junitxml=test-results.xml
      - run: python scripts/check_package.py
      - run: python scripts/build_package.py
      - run: python -c 'from pathlib import Path; import yaml; [yaml.safe_load(p.read_text()) for p in Path(".github").rglob("*.yml")]; print("Workflow YAML parsed")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comwintop-tested-beta
          path: |
            dist/*
            test-results.xml
          retention-days: 14
